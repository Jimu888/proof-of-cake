const titles=['A wish, held.','Your own orbit','Another year'];
const blessingLabels={birthday:'生日快乐，愿你新的一岁好运不断。',encounter:'很高兴在这个世界遇见你。',memory:'送你一份链上的生日纪念。',none:''};
const params=new URLSearchParams(location.search);
let connected=false,selected=1;
const dialog=document.querySelector('#gift-dialog');
const content=document.querySelector('#gift-content');
let returnFocus=null;
function notify(text){const t=document.querySelector('.toast');t.textContent=text;t.hidden=false;clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>t.hidden=true,2800)}
function showDialog(){returnFocus=document.activeElement;if(!dialog.open)dialog.showModal()}
function closeDialog(){dialog.close();returnFocus?.focus()}
document.querySelector('.modal-close').addEventListener('click',closeDialog);
dialog.addEventListener('click',e=>{if(e.target===dialog){const r=dialog.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)closeDialog()}});
function connect(){connected=true;document.querySelectorAll('[data-wallet]').forEach(b=>b.textContent='演示身份 jimu.ai');notify('已切换为演示身份；未连接真实钱包。')}
document.querySelectorAll('[data-wallet]').forEach(b=>b.addEventListener('click',connect));
function openGift(id){selected=id;content.innerHTML=`<div class="modal-grid"><div class="modal-art"><img src="${artworks[id-1]}" alt="所选概念作品" width="720" height="720"></div><div class="modal-copy"><h2 id="gift-heading">为朋友准备礼物</h2><p>${titles[id-1]}</p><form id="gift-form" novalidate><label class="label" for="recipient">送给谁</label><input id="recipient" name="recipient" placeholder="例如 satoshi.ai" aria-describedby="recipient-help recipient-error" maxlength="40" autocomplete="off"><small class="field-help" id="recipient-help">3–15 位字母或数字，可带 .ai；此处不查询真实地址。</small><label class="label" for="blessing">选一句祝福</label><select id="blessing" name="blessing"><option value="birthday">生日快乐，愿你新的一岁好运不断。</option><option value="encounter">很高兴在这个世界遇见你。</option><option value="memory">送你一份链上的生日纪念。</option><option value="none">不附留言</option></select><div class="summary"><div><span>送礼署名</span><span>演示身份 jimu.ai</span></div><div><span>作品价格</span><span>尚未定价</span></div></div><p class="error" id="recipient-error" role="alert"></p><button class="primary" type="submit">预览这份礼物</button><p class="demo-note" style="margin-top:12px">只预览送礼体验，不付款，不创建或发送 NFT。</p></form></div></div>`;showDialog();
const form=document.querySelector('#gift-form');form.addEventListener('submit',e=>{e.preventDefault();const input=document.querySelector('#recipient');const handle=input.value.trim().toLowerCase().replace(/\.ai$/,'');if(!/^[a-z0-9]{3,15}$/.test(handle)){input.setAttribute('aria-invalid','true');document.querySelector('#recipient-error').textContent='请输入 3–15 位字母或数字的 Agent ID。';input.focus();return}input.removeAttribute('aria-invalid');showReceipt(id,handle+'.ai',document.querySelector('#blessing').value)});}
function safeName(v){return /^[a-z0-9]{3,15}\.ai$/.test(v)?v:'friend.ai'}
function showReceipt(id,handle,blessing){handle=safeName(handle);const bl=Object.hasOwn(blessingLabels,blessing)?blessing:'birthday';content.innerHTML=`<div class="receipt"><p class="meta">礼物页面预览，未发生真实赠送。</p><h2 id="gift-heading">${handle}，生日快乐。</h2><p>一份来自 jimu.ai 的心意</p><img src="${artworks[id-1]}" alt="礼物概念作品" width="720" height="720"><h3>${titles[id-1]}</h3><blockquote>${blessingLabels[bl]}</blockquote><p class="demo-note">这是设计演示。作品尚未铸造，钱包没有收到 NFT。</p><button class="primary" id="share-gift">复制预览链接</button><button class="secondary" id="edit-gift">重新准备</button></div>`;document.querySelector('#share-gift').addEventListener('click',async()=>{const u=new URL(location.href);u.searchParams.set('preview',String(id));u.searchParams.set('to',handle);u.searchParams.set('blessing',bl);try{await navigator.clipboard.writeText(u.href);notify('预览链接已复制，仅限当前本地演示环境使用。')}catch{notify('复制不可用，可以复制浏览器中的页面地址。');history.replaceState(null,'',u.href)}});document.querySelector('#edit-gift').addEventListener('click',()=>openGift(id));}
document.querySelectorAll('[data-gift]').forEach(b=>b.addEventListener('click',()=>openGift(Number(b.dataset.gift))));
document.querySelectorAll('[data-filter]').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('[data-filter]').forEach(t=>t.setAttribute('aria-pressed',String(t===b)));document.querySelectorAll('[data-category]').forEach(c=>c.hidden=b.dataset.filter!=='全部'&&c.dataset.category!==b.dataset.filter)}));
document.querySelectorAll('[data-shelf]').forEach(b=>b.addEventListener('click',()=>{content.innerHTML='<div class="receipt"><h2 id="gift-heading">你的生日收藏</h2><div class="empty" style="margin:24px 0"><h3>下一份心意，从这里开始。</h3><p style="margin-top:12px">演示身份还没有收藏。真实版本会在这里展示收到的礼物。</p></div><button class="primary" id="back-gallery">去挑一份礼物</button></div>';showDialog();document.querySelector('#back-gallery').onclick=()=>{closeDialog();location.hash='collection'}}));
const quick=document.querySelector('#quick-form');if(quick)quick.addEventListener('submit',e=>{e.preventDefault();openGift(1);document.querySelector('#recipient').value=document.querySelector('#quick-recipient').value});
if(['1','2','3'].includes(params.get('preview'))){showReceipt(Number(params.get('preview')),params.get('to')||'friend.ai',params.get('blessing')||'birthday');showDialog()}
</script></body></html>
